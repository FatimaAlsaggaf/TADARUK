<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>تدارك — نموذج تسريب ثلاثي الأبعاد</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f192a;color:#e7f4ff;font:14px Tahoma,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#0b1422;border-bottom:1px solid #2b405b}
strong{font-size:16px}small{font-size:11px;color:#a8bed4}.warn{font-size:10px;border:1px solid #47728a;background:#1b3545;padding:6px 8px;border-radius:8px}
#view{height:calc(100dvh - 114px);min-height:290px;position:relative;background:radial-gradient(circle at 50% 35%,#273b56,#101a2a 68%)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.controls{position:absolute;top:13px;left:12px;display:grid;gap:8px;z-index:2}
.controls button{width:58px;height:49px;border:1px solid #456382;color:#d8efff;background:#21344dba;border-radius:11px;font:12px Tahoma;cursor:pointer}
.controls b{display:block;font-size:19px}
#tag{position:absolute;z-index:3;padding:7px 10px;background:#c32938;border:1px solid #fc7078;border-radius:9px;pointer-events:none;font-size:12px;box-shadow:0 0 14px #bd263980}
footer{text-align:center;padding:12px 15px;font-size:12px;background:#111f32;color:#bed3e7}
#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:22px;text-align:center;background:#111b2a}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script></head>
<body><header><strong>تدارك · استكشاف العطل 3D</strong><span class="warn">نموذج توضيحي، ليس ناتج صورة البلاغ</span></header>
<div id="view"><div id="tag">⚠ مكان التسريب</div><div class="controls"><button id="rotate"><b>⟳</b>تدوير</button><button id="plus"><b>⊕</b>تكبير</button><button id="minus"><b>⊖</b>تصغير</button><button id="full"><b>⛶</b>ملء الشاشة</button></div><div id="error">تعذر تحميل العارض. تحققي من اتصال الإنترنت.</div></div>
<footer>اسحبي لتدوير المجسم 360° · قرّبي للتكبير · بزر الماوس الأيمن لتحريك المشهد</footer>
<script type="module">
try{
const T=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const host=document.getElementById('view'),scene=new T.Scene();scene.background=new T.Color('#111b2b');
const camera=new T.PerspectiveCamera(39,1,.1,90);camera.position.set(4,3.2,5.4);
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.45;host.prepend(r.domElement);
const control=new OrbitControls(camera,r.domElement);control.enableDamping=true;control.target.set(0,1.25,0);control.minDistance=2.1;control.maxDistance=9;control.maxPolarAngle=1.49;control.autoRotate=true;control.autoRotateSpeed=.5;control.update();
scene.add(new T.HemisphereLight(0xc0e5ff,0x344054,2.6));const light=new T.DirectionalLight(0xffffff,4);light.position.set(-3,6,5);light.castShadow=true;scene.add(light);
const metal=new T.MeshPhysicalMaterial({color:0x9aa6b2,metalness:.88,roughness:.27,clearcoat:1}),chrome=new T.MeshPhysicalMaterial({color:0xdfebf4,metalness:1,roughness:.12}),hose=new T.MeshStandardMaterial({color:0x6c6c6b,roughness:.75,metalness:.35});
function mesh(g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
mesh(new T.BoxGeometry(4.5,.21,3),new T.MeshStandardMaterial({color:0x465363}),0,-.16,0);
for(let x=-4;x<5;x++)for(let z=-3;z<3;z++)mesh(new T.BoxGeometry(.48,.014,.48),new T.MeshStandardMaterial({color:0x697480,roughness:.88}),x*.49,-.043,z*.49);
mesh(new T.CylinderGeometry(.105,.13,2.65,38),metal,1.1,1.33,-.1);
mesh(new T.CylinderGeometry(1.25,1.14,.25,80),metal,.06,2.7,-.1).scale.set(1.25,1,.72);
mesh(new T.CylinderGeometry(1.29,1.29,.052,80),chrome,.06,2.86,-.1).scale.set(1.25,1,.75);
mesh(new T.CylinderGeometry(.14,.1,.25,32),chrome,-.15,2.38,.1);
const curve=new T.CatmullRomCurve3([new T.Vector3(-.15,2.25,.10),new T.Vector3(-.25,1.95,.19),new T.Vector3(-.37,1.48,.25),new T.Vector3(-.22,1.1,.35),new T.Vector3(-.07,.82,.4)]);
mesh(new T.TubeGeometry(curve,70,.073,12,false),hose,0,0,0);
const leak=curve.getPoint(.88);const red=new T.MeshStandardMaterial({color:0xff4855,emissive:0xec2233,emissiveIntensity:.8});
mesh(new T.TorusGeometry(.1,.016,8,40),red,leak.x,leak.y,leak.z+.07);
const water=new T.MeshPhysicalMaterial({color:0x83c7ee,transparent:true,opacity:.73,metalness:.28,roughness:.11});
const drops=Array.from({length:7},()=>mesh(new T.SphereGeometry(.027,12,12),water,leak.x,0,leak.z));
const puddle=mesh(new T.CircleGeometry(.57,64),new T.MeshPhysicalMaterial({color:0x87c1d5,transparent:true,opacity:.62,roughness:.16}),0,-.03,.43);puddle.rotation.x=-Math.PI/2;puddle.scale.set(1.4,.75,1);
const tag=document.getElementById('tag');
function fit(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();r.setSize(w,h,false)}new ResizeObserver(fit).observe(host);fit();
function run(){requestAnimationFrame(run);control.update();const t=performance.now()/1000;drops.forEach((d,i)=>{d.position.set(leak.x,leak.y-((t*.65+i*.16)%(leak.y+.1)),leak.z);d.visible=d.position.y>.01});const p=leak.clone().project(camera);tag.style.right='auto';tag.style.left=((p.x+1)*.5*host.clientWidth+8)+'px';tag.style.top=((-p.y+1)*.5*host.clientHeight-39)+'px';r.render(scene,camera)}run();
document.getElementById('rotate').onclick=()=>{control.autoRotate=!control.autoRotate};document.getElementById('plus').onclick=()=>{camera.position.lerp(control.target,.19)};document.getElementById('minus').onclick=()=>{camera.position.sub(control.target).multiplyScalar(1.24).add(control.target)};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():host.requestFullscreen();
}catch(e){console.error(e);document.getElementById('error').style.display='flex';}
</script></body></html>
